---
# GitHub releases carry code only: the vendored source tarball and compiled binary
# archives, with checksums. Packages are built from source and published by Launchpad
# (Ubuntu, through the PPA) and COPR (RHEL); none are attached to the release.
name: Release
on:
  push:
    tags:
      - v*

env:
  # The PPA source packages are uploaded to.
  PPA: ${{ vars.PPA || 'ppa:w-rouesnel/tmux-tabbed-terminal' }}
  # The COPR project the source RPM is built in, as owner/project.
  COPR_PROJECT: ${{ vars.COPR_PROJECT }}

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  generate-release-matrix:
    runs-on: ubuntu-24.04
    outputs:
      release-matrix: ${{ steps.generate-matrix.outputs.release-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate Release Matrix
        id: generate-matrix
        run: go run mage.go githubReleaseMatrix

  # Binary archives, built natively per architecture since the UI links GTK3 and VTE with
  # cgo. They link Ubuntu 24.04's libraries.
  binaries:
    needs:
      - integration
      - generate-release-matrix
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-release-matrix.outputs.release-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libvte-2.91-dev
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Binary archive
        run: |
          go run mage.go release ${{ matrix.osarch }}
          cd release && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.osarch }}
          path: |
            release/*.tar.gz
            release/*.sha256

  # The GitHub release: the vendored source tarball, which packages are built from, and
  # the binary archives.
  github-release:
    needs:
      - integration
      - binaries
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Source tarball
        run: go run mage.go source

      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release/binaries

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/source/*
            release/binaries/*

  # Uploads signed source packages to the PPA, where Launchpad builds them. Needs the PPA
  # on Launchpad with the signing key registered to the account, and, for Ubuntu 24.04, a
  # dependency on ppa:longsleep/golang-backports for Go 1.26: see the README.
  ppa:
    needs:
      - integration
    strategy:
      matrix:
        suite: [noble, resolute]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper devscripts dput

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Import signing key
        uses: ./.github/actions/import-signing-key
        with:
          key: ${{ secrets.PACKAGE_SIGNING_KEY }}
          passphrase: ${{ secrets.PACKAGE_SIGNING_KEY_PASSPHRASE }}
          fingerprint: ${{ vars.PACKAGE_SIGNING_KEY_FINGERPRINT }}

      - name: Source package
        run: DEB_SIGNING_KEY="$SIGNING_KEY" go run mage.go debSource ${{ matrix.suite }}

      - name: Upload to the PPA
        run: dput "$PPA" release/ppa/${{ matrix.suite }}/*_source.changes

  # Builds the source RPM in COPR, which builds and signs the RHEL packages. Needs the
  # COPR project, the COPR_PROJECT variable and the COPR_CONFIG secret: see the README.
  copr:
    needs:
      - integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm pipx
          pipx install copr-cli

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Source RPM
        run: go run mage.go srpm

      - name: Build in COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ] || [ -z "$COPR_PROJECT" ]; then
            echo "::error::The COPR_CONFIG secret or COPR_PROJECT variable is not set"
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          copr-cli build "$COPR_PROJECT" release/srpm/*.src.rpm
