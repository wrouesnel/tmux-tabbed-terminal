---
name: Release
on:
  push:
    tags:
      - v*
  # Rebuild the APT repository from the existing releases without making a new one.
  workflow_dispatch:

env:
  BUILD_DEPS: libgtk-3-dev libvte-2.91-dev tmux

jobs:
  integration:
    if: github.event_name == 'push'
    uses: ./.github/workflows/integration.yml

  generate-release-matrix:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release-matrix: ${{ steps.generate-matrix.outputs.release-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Release Matrix
        id: generate-matrix
        run: go run mage.go githubReleaseMatrix

  # The UI links GTK3 and VTE with cgo, so each architecture builds on its own runner.
  release-build:
    needs:
      - integration
      - generate-release-matrix
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-release-matrix.outputs.release-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags -f

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release Build
        run: go run mage.go release ${{ matrix.osarch }}

      - name: Debian Package
        run: go run mage.go deb ${{ matrix.osarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.osarch }}
          path: release/*

  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs:
      - release-build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*

  # Publishes an APT repository of every release's packages to GitHub Pages. The
  # repository is rebuilt from the release assets each time, so Pages holds no state of
  # its own. Needs Pages set to deploy from GitHub Actions, the PACKAGE_SIGNING_KEY and
  # PACKAGE_SIGNING_KEY_PASSPHRASE secrets, and the PACKAGE_SIGNING_KEY_FINGERPRINT variable:
  # see the README.
  publish-apt:
    needs:
      - release
    # Run after a release, or on its own when dispatched.
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download packages from every release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .apt-pool
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release download "$tag" --pattern '*.deb' --dir .apt-pool --skip-existing
          done
          ls -l .apt-pool

      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          FINGERPRINT: ${{ vars.PACKAGE_SIGNING_KEY_FINGERPRINT }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ] || [ -z "$FINGERPRINT" ]; then
            echo "::error::The PACKAGE_SIGNING_KEY secret or PACKAGE_SIGNING_KEY_FINGERPRINT variable is not set"
            exit 1
          fi
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          echo "APT_SIGNING_KEY=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build APT repository
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_KEY_PASSPHRASE }}
          APT_POOL_DIR: .apt-pool
          APT_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: go run mage.go aptRepo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
