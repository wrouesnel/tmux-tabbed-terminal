---
name: Build and Test
"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  # Tag builds run this via release.yml.
  workflow_call:

# Packages are built for Ubuntu noble, so CI runs on it too. Every job that compiles Go
# needs the GTK3 and VTE headers, because the UI links them with cgo.
env:
  BUILD_DEPS: libgtk-3-dev libvte-2.91-dev tmux

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS
      # The build tools (golangci-lint) need a current Go; the packaging jobs below build
      # with go.mod's, as the distributions do.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check style
        run: go run mage.go style

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS
      # The build tools (golangci-lint) need a current Go; the packaging jobs below build
      # with go.mod's, as the distributions do.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Lint
        # Loading the packages compiles gotk3's cgo, which takes minutes from a cold cache.
        env:
          LINTER_DEADLINE: 10m
        run: go run mage.go lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS xvfb
      # The build tools (golangci-lint) need a current Go; the packaging jobs below build
      # with go.mod's, as the distributions do.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        run: go run mage.go test
      # The same tests with pkg/termwidget, the Windows terminal, in place of VTE.
      - name: Test with the native terminal
        run: go test -count=1 -tags nativeterm ./pkg/termwidget/... ./pkg/ui ./pkg/vte ./pkg/entrypoints/...
      - name: Merge Coverage Files
        run: go run mage.go coverage
      - name: Coveralls
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: .cover.out

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS
      # The build tools (golangci-lint) need a current Go; the packaging jobs below build
      # with go.mod's, as the distributions do.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go run mage.go binary

  # The Windows build, with GTK3 and Go from MSYS2's UCRT64 environment. VTE doesn't
  # support Windows, so terminals there are pkg/termwidget's, on ConPTY.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build
        run: go build -o tmux-tabbed-terminal.exe ./cmd/tmux-tabbed-terminal
      - name: Vet
        run: go vet ./...
      # Every test compiles; the ones which don't need tmux run.
      - name: Test
        run: |
          go test -count=1 -run '^$' ./...
          go test -count=1 ./pkg/activity ./pkg/sessionlist ./pkg/theme ./pkg/ui ./pkg/vte \
            ./pkg/termwidget/...

  # The source RPM, rebuilt in a container of each RHEL release as COPR builds it: from the
  # vendored source tarball, with the release's own Go and libraries.
  srpm:
    strategy:
      matrix:
        include:
          - el: el8
            image: docker.io/library/rockylinux:8
            repos: --enablerepo=powertools
          - el: el10
            image: docker.io/library/almalinux:10
            repos: --enablerepo=crb
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install packaging tools
        run: dnf install -y git rpm-build dnf-plugins-core tar gzip tmux
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test against the release's tmux
        run: go test ./pkg/tmux/
      - name: Source RPM
        run: go run mage.go srpm
      - name: Build dependencies
        run: dnf builddep -y ${{ matrix.repos }} release/srpm/*.src.rpm
      - name: Rebuild
        run: rpmbuild --rebuild release/srpm/*.src.rpm

  # The PPA's source packages, built as Launchpad builds them: from the vendored modules,
  # with the suite's packaged Go, without fetching anything. Ubuntu 24.04's Go 1.24 is
  # golang-1.24-go; later releases' default Go is new enough.
  ppa-source:
    strategy:
      matrix:
        suite: [noble, resolute]
    runs-on: ubuntu-24.04
    container: docker.io/library/ubuntu:${{ matrix.suite }}
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper \
            dpkg-dev libgtk-3-dev libvte-2.91-dev pkgconf
          if [ "${{ matrix.suite }}" = noble ]; then go=golang-1.24-go; else go=golang-go; fi
          apt-get install -y --no-install-recommends "$go"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Source package
        run: PATH=/usr/lib/go-1.24/bin:$PATH go run mage.go debSource ${{ matrix.suite }}
      - name: Build it
        run: |
          cd release/ppa/${{ matrix.suite }}
          dpkg-source -x ./*.dsc build
          cd build
          dpkg-buildpackage -b -us -uc
