---
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '23 7 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The UI links GTK3 and VTE with cgo.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libvte-2.91-dev

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A restored build cache means nothing is compiled, and CodeQL extracts only what
          # it sees compiled.
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Autobuild doesn't know about the cgo dependencies: build the packages directly.
          build-mode: manual
          # queries: security-extended,security-and-quality

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
