<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig's configuration for the Windows bundle, where GTK draws text with fontconfig
     and FreeType, as on GNOME, rather than with Windows' renderer, whose text is thin and
     unsmoothed over Remote Desktop, which turns ClearType off. The fonts are those
     installed with the application, in share\fonts, and Windows' own, for the window's
     Segoe UI and for characters the bundled fonts lack, such as emoji. -->
<fontconfig>
  <dir>APPSHAREFONTDIR</dir>
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>

  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Ubuntu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Segoe UI</family></prefer>
  </alias>

  <!-- GNOME's defaults: grayscale antialiasing with slight hinting, which look the same on
       any screen and over Remote Desktop. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
