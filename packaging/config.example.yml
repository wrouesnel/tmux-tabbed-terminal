# Example configuration for tmux-tabbed-terminal.
#
# Copy to ~/.config/tmux-tabbed-terminal/config.yml. Every key is optional: missing keys
# keep the defaults shown here.

tmux:
  # The tmux executable. Where the application was installed with a tmux of its own, as
  # on Windows, "tmux" means that one.
  binary: tmux
  # Run the tmux in PATH rather than the one installed with the application.
  use-system-tmux: false
  # The shell new sessions, windows and panes on this machine run, set as tmux's
  # default-shell. Empty leaves tmux's own setting, except that the tmux installed with
  # the application runs PowerShell.
  default-shell: ""
  # Select a tmux server other than the default one, as with tmux -L or tmux -S.
  socket-name: ""
  socket-path: ""

appearance:
  # Take font and colors from GNOME Terminal's default profile, if it's installed.
  use-gnome-terminal-profile: true
  # A Pango font description. Empty uses the profile's font, or the desktop's
  # monospace font.
  font: ""
  # Set both to override the colors. Empty uses the profile's colors or the GTK theme.
  foreground: ""
  background: ""
  # A built-in palette name (gnome, tango, linux, xterm, solarized) or 16 colors.
  palette: []
  # Show bold text in bright colors. Unset uses the profile's setting.
  # bold-is-bright: false
  # The terminal's own scrollback. tmux keeps the real history.
  scrollback-lines: 1000
  # Initial width of the session list in pixels.
  sidebar-width: 220

activity:
  # How often tmux is asked for the state of every session.
  poll-interval: 1s
  # How long a session shows as busy after its last output.
  timeout: 2s

sidebar:
  # Group sessions by the program running in their current window, such as claude or vim.
  # The toggle under the session list changes it while running.
  group-by-application: true
  # How long a session must run a new program before it moves to that program's group,
  # so short commands don't move it.
  group-hold: 3s
  # The side of the window the list is on: left or right. The button under the list
  # changes it, and that choice is remembered.
  position: left

tab-bar:
  # Where the bar of the focused session's tmux windows is: top or bottom, above or below
  # the terminals. Preferences changes it, and that choice is remembered.
  position: top

clipboard:
  # Put text copied in tmux on the desktop clipboard, from this machine and remote hosts:
  # each new paste buffer, as copy mode makes, and as programs make with OSC 52 when
  # tmux's set-clipboard option is on.
  from-tmux: true

links:
  # Show the image a link names, such as ![shot](img/a.png) in markdown, when the pointer
  # rests on the link. Remote images are read over the host's ssh connection.
  image-previews: true

keyboard:
  # Shortcuts in place of the defaults, by action. Actions with a default shortcut go by
  # their short name: new-window, preferences, close-window, new-session, close-pane,
  # copy, paste, split-right, split-down, next-session, prev-session, next-pane,
  # prev-pane, zoom-in, zoom-out, zoom-normal, show-sidebar, find-session, fullscreen,
  # rename-session and switch-to-1 to switch-to-9. Any action goes by its full name, such
  # as win.save-scrollback. Shortcuts are GTK accelerators; an empty list removes them.
  shortcuts: {}
  #  paste: ["<Control><Shift>v", "<Shift>Insert"]

behaviour:
  # Create a session when a window opens and there are none.
  create-session-on-start: true
  # Where new sessions start when the current session's directory isn't known.
  # Empty means the home directory.
  new-session-directory: ""
  # Ask before killing a session.
  confirm-kill: true

# Remote hosts whose sessions are listed, besides those added with "Add Host" (which are
# saved to ~/.config/tmux-tabbed-terminal/hosts.yml). Each is reached with ssh.
hosts: []
#  - destination: buildbox
#  - destination: admin@db.example.com
#    ssh-options: ["-p", "2222"]
